# Glossário PT-BR ↔ EN do Chiocca System.
# PT-BR ↔ EN glossary of the Chiocca System.
#
# Regra: cada termo tem UMA tradução, usada em todo texto gerado (relatórios,
# ficha de alerta, README, interface). Termo sem equivalente fica no original
# e ganha a explicação da coluna "nota_en" na primeira ocorrência em inglês.
#
# Rule: each term has ONE translation, used in every generated text. Terms with
# no English equivalent stay in Portuguese and get the "nota_en" explanation the
# first time they appear in English.
#
# Equivalências contábeis seguem a correspondência CPC ↔ IFRS. Confira com a
# norma quando houver dúvida; não invente termo novo.

demonstracoes:
  - pt: "Demonstrações Financeiras Padronizadas (DFP)"
    en: "Standardized Financial Statements (DFP)"
    nota_en: "Annual filing that Brazilian listed companies submit to the CVM."
  - pt: "Informações Trimestrais (ITR)"
    en: "Quarterly Information (ITR)"
    nota_en: "Quarterly filing submitted to the CVM."
  - pt: "Formulário de Referência (FRE)"
    en: "Reference Form (FRE)"
    nota_en: "Annual disclosure on governance, risks, compensation and related parties."
  - pt: "Balanço patrimonial"
    en: "Balance sheet (statement of financial position)"
  - pt: "Demonstração do resultado (DRE)"
    en: "Income statement"
  - pt: "Demonstração dos fluxos de caixa (DFC)"
    en: "Statement of cash flows"
  - pt: "Notas explicativas"
    en: "Notes to the financial statements"
  - pt: "Reapresentação"
    en: "Restatement"
  - pt: "Fato relevante"
    en: "Material fact notice"
    nota_en: "Mandatory public announcement of price-sensitive information under CVM rules."

contas:
  - pt: "Receita líquida de vendas"
    en: "Net revenue"
  - pt: "Custo dos bens e/ou serviços vendidos"
    en: "Cost of sales"
  - pt: "Resultado bruto"
    en: "Gross profit"
  - pt: "Despesas com vendas"
    en: "Selling expenses"
  - pt: "Despesas gerais e administrativas"
    en: "General and administrative expenses"
  - pt: "Resultado antes do resultado financeiro e dos tributos"
    en: "Operating profit (EBIT)"
  - pt: "Despesas financeiras"
    en: "Finance costs"
  - pt: "Lucro líquido"
    en: "Net income"
  - pt: "Caixa líquido das atividades operacionais"
    en: "Net cash from operating activities"
  - pt: "Contas a receber"
    en: "Trade receivables"
  - pt: "Estoques"
    en: "Inventories"
  - pt: "Imobilizado"
    en: "Property, plant and equipment"
  - pt: "Intangível"
    en: "Intangible assets"
  - pt: "Fornecedores"
    en: "Trade payables"
  - pt: "Empréstimos e financiamentos"
    en: "Borrowings"
  - pt: "Patrimônio líquido"
    en: "Shareholders' equity"
  - pt: "Depreciação e amortização"
    en: "Depreciation and amortization"

conceitos:
  - pt: "Prazo médio de pagamento a fornecedores"
    en: "Days payable outstanding (DPO)"
  - pt: "Risco sacado"
    en: "risco sacado (supplier finance)"
    nota_en: "Arrangement in which a bank pays the supplier and the company repays the bank later; also called reverse factoring."
  - pt: "Verba de propaganda cooperada (VPC)"
    en: "cooperative advertising allowance (VPC)"
    nota_en: "Amount a supplier pays a retailer to fund joint marketing; it reduces the retailer's cost."
  - pt: "Accruals (lucro que não vira caixa)"
    en: "Accruals"
  - pt: "Forfait (financiamento de compras embutido na fatura do fornecedor)"
    en: "forfait (supplier invoice with embedded financing)"
    nota_en: "Supplier finance in which the invoice includes the financing cost; the buyer records it in inventory and trade payables, so the interest never shows as a finance cost."
  - pt: "Caixa restrito"
    en: "Restricted cash"
  - pt: "Rendimento do caixa"
    en: "Cash yield"
  - pt: "Fluxo de caixa livre"
    en: "Free cash flow"
  - pt: "Dividendos acima do fluxo de caixa livre"
    en: "Dividends above free cash flow"
  - pt: "Juros sobre capital próprio (JCP)"
    en: "juros sobre capital próprio (interest on equity)"
    nota_en: "Brazilian form of shareholder payout that is tax-deductible for the company; treated like dividends in this project."
  - pt: "Partes relacionadas"
    en: "Related parties"
  - pt: "Valor justo nível 3"
    en: "Level 3 fair value"
  - pt: "Ganho não recorrente"
    en: "Non-recurring gain"
  - pt: "Parecer do auditor"
    en: "Auditor's report"
  - pt: "Ressalva"
    en: "Qualified opinion"
  - pt: "Abstenção de opinião"
    en: "Disclaimer of opinion"
  - pt: "Partes relacionadas"
    en: "Related parties"
  - pt: "Companhia aberta"
    en: "Listed company"
  - pt: "Registro cancelado"
    en: "Delisted (registration cancelled)"

estudo:
  - pt: "Valores neutros (para dado faltante)"
    en: "Neutral values (for missing data)"
  - pt: "Aparar valores extremos (winsorizar)"
    en: "Winsorize"
  - pt: "Quebra de série"
    en: "Structural break"
  - pt: "Bootstrap (referência simulada)"
