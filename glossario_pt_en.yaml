  - pt: "Alerta"
    en: "Alert"
  - pt: "Alarme falso"
    en: "False alarm (false positive)"
  - pt: "Caso acertado"
    en: "Detected case"
  - pt: "Gabarito"
    en: "Ground truth (reference cases)"
  - pt: "Pré-registro"
    en: "Pre-registration"
  - pt: "Ponto de corte"
    en: "Cut-off"
  - pt: "Data de corte"
    en: "Cut-off date"
  - pt: "Como era na época"
    en: "Point-in-time (as known at the time)"
  - pt: "Regra boba de comparação"
    en: "Naive baseline rule"
  - pt: "Viés de sobrevivência"
    en: "Survivorship bias"

instituicoes:
  - pt: "CVM (Comissão de Valores Mobiliários)"
    en: "CVM"
    nota_en: "Brazil's securities regulator."
  - pt: "B3"
    en: "B3"
    nota_en: "Brazil's stock exchange."
  - pt: "CPC (Comitê de Pronunciamentos Contábeis)"
    en: "CPC"
    nota_en: "Body that issues Brazilian accounting standards, aligned with IFRS."
