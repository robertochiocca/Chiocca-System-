# Origem: DireitoAberto (github.com/robertochiocca/direitoaberto), .github/workflows/ci.yml,
# commit 102e3e2d9d70e87249d8df9215737e2d98b6358d. Adaptado para o Chiocca System.
# O que mudou: comandos do Chiocca (ruff, black, mypy e pytest); na Fase E, o job do web (build, tipos, testes de
# contrato e npm audit); na resposta à Fase E, o build da demonstração estática e o teste de tela (Playwright); na
# Fase E2, o axe no teste de tela e as capturas para revisão, guardadas como artefato; em 15/11/2026, as actions nas
# versões que rodam em Node.js 24 (sem mudar o que os jobs fazem) e o teste de tela e as capturas no build com o prefixo
# do GitHub Pages (/Chiocca-System-), o mesmo que é publicado; em 21/11/2026, o job demo, que confere o make demo.
# Não usa segredos nem faz deploy; só lê o repositório. Os testes rodam sem rede e sem os dados brutos da CVM
# (data/brutos, data/base e resultados/ ficam fora do git): os documentos gerados são conferidos contra os JSON
# versionados.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]  # a versão mínima declarada (o numpy 2.5.3 exige 3.12) e a usada no desenvolvimento
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # Versões travadas em requirements-lock.txt (pedido de 09/11/2026): o pacote entra sem resolver dependências.
      - run: python -m pip install -r requirements-lock.txt && python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check chiocca tests
      - name: Formatação
        run: black --check chiocca tests
      - name: Tipos
        run: mypy chiocca tests
      - name: Testes
        run: python -m pytest -q

  # Auditoria de dependências (pedido de 09/11/2026; padrão do FraudShield, MIT, sem código copiado): pip-audit sobre
  # o requirements-lock.txt, num job separado para não esconder o resultado dos outros. Se apontar vulnerabilidade, o
  # job falha e a troca de versão espera a decisão de Roberto: nenhuma versão é trocada automaticamente.
  auditoria-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: pip-audit
        run: pip-audit -r requirements-lock.txt --no-deps --disable-pip --progress-spinner off

  # Interface (Fase E): checagem de tipos, testes de contrato com a API (sem rede: os exemplos guardados e as respostas
  # da API geradas pelos testes do Python), build, build da demonstração estática com teste de tela num navegador de
  # verdade (dados de teste montados de docs/exemplos/) e auditoria de dependências do npm. Nada é publicado.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Testes de contrato e regras
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Build da demonstração estática (com o prefixo do GitHub Pages, como é publicado)
        run: npm run build:estatico
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: /Chiocca-System-
      - name: Navegador do teste de tela
        run: npx playwright install --with-deps chromium
      - name: Teste de tela (PT e EN, com axe)
        run: npm run test:tela
      - name: Capturas para revisão (computador e celular, PT e EN, claro e escuro)
        run: npm run capturas
      - name: Guardar as capturas
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: web/capturas/
          retention-days: 30
      - name: npm audit
        run: npm audit --audit-level=high

  # make demo (pedido de 21/11/2026): o comando da raiz sobe a demonstração com os exemplos versionados
  # (docs/exemplos/), sem baixar nada da CVM e sem API. O job roda o make demo em segundo plano, confere a página
  # inicial, o índice (só a Americanas, só o exercício 2021), uma investigação e um PDF, e para o servidor.
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make demo e conferência do que é servido
        run: |
          make demo PORTA=3000 > demo.log 2>&1 &
          for i in $(seq 1 180); do
            grep -q "Demonstração local em" demo.log && break
            grep -q "make: \*\*\*" demo.log && break
            sleep 2
          done
          cat demo.log
          grep -q "Demonstração local em http://127.0.0.1:3000/" demo.log
          curl -fsS -o inicial.html http://127.0.0.1:3000/ && grep -q "Chiocca" inicial.html
          curl -fsS -o /dev/null http://127.0.0.1:3000/investigacao/
          curl -fsS http://127.0.0.1:3000/demo/indice.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert [e['cd_cvm'] for e in d['empresas']] == ['20990'], d['empresas']
          assert all(max(x) < 2024 for e in d['empresas'] for x in e['datas'].values())
          "
          curl -fsS http://127.0.0.1:3000/demo/investigacoes/20990/2021/2022-04-30/pt.json | python3 -c "
          import json, sys
          assert [x['exercicio'] for x in json.load(sys.stdin)['exercicios']] == [2021]
          "
          curl -fsS -o /dev/null http://127.0.0.1:3000/demo/investigacoes/20990/2021/2024-12-31/en.pdf
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/demo/investigacoes/100/2020/2022-04-30/pt.json)" = 404
          pkill -f demonstracao-local.mjs
