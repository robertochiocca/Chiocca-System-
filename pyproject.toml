[project]
name = "chiocca"
version = "0.1.0"
description = "Alertas contábeis com dados abertos da CVM, calculados como eram na época · Accounting alerts from CVM open data, as they were at the time"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]

[tool.setuptools]
packages = ["chiocca", "chiocca.sinais", "chiocca.v2"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
extend-exclude = ["scripts/fase0"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["scripts/fase0/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"chiocca/relatorio_base.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/textos_resultados.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/ficha.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/textos_resumo.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/v2/analises_pos_estudo_1.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/v2/analises_pos_estudo_1_dados.py" = ["E501"]  # agregações com dicionários longos
"chiocca/v2/conferencias.py" = ["E501"]  # tabela de definições com textos PT e EN
"chiocca/v2/confianca.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/v2/linhagem.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/v2/relatorio_conferencias.py" = ["E501"]  # catálogo de mensagens em prosa
