[project]
name = "chiocca"
version = "0.1.0"
description = "Alertas contábeis com dados abertos da CVM, calculados como eram na época · Accounting alerts from CVM open data, as they were at the time"
requires-python = ">=3.12"  # o numpy 2.5.3 do estudo 1 exige Python 3.12 ou mais (decisão de 09/11/2026)
dependencies = ["pandas==3.0.5", "numpy==2.5.3", "duckdb==2.0.0", "pyarrow==26.0.1",
                "fastapi==0.162.2", "pydantic==2.13.5", "uvicorn==0.54.0",  # API (Fase D)
                "pypdf==6.21.4"]  # texto das notas explicativas (Fase F1, decisão de 11/11/2026; BSD-3-Clause)

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy", "httpx==0.28.1"]  # httpx: o TestClient dos testes da API

[tool.setuptools]
packages = ["chiocca", "chiocca.sinais", "chiocca.v2", "chiocca.v2.leitor"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
extend-exclude = ["scripts/fase0"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"  # numpy 2.5.3, a versão do estudo 1, exige Python 3.12 ou mais (os stubs usam a sintaxe `type`)
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["scripts/fase0/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"chiocca/relatorio_base.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/textos_resultados.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/ficha.py" = ["E501"]  # catálogo de mensagens em prosa
"chiocca/textos_resumo.py" = ["E501"]  # catálogo de mensagens em prosa
# Fase F1: catálogos de expressões regulares, vocabulário e textos do leitor
"chiocca/v2/leitor/nomes.py" = ["E501"]
"chiocca/v2/leitor/partes_relacionadas.py" = ["E501"]
